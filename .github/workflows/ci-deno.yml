name: CI - Deno Tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ 'feature/*', 'main' ]

jobs:
  deno-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x
      - name: Run all Deno tests
        run: deno test --unstable --allow-net --allow-env
