name: Deploy Adaptive Quiz

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  test-and-deploy:
    name: Test & Deploy adaptive-quiz
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Run Deno unit tests for functions
        run: deno test --unstable --allow-net --allow-env supabase/functions/adaptive-quiz/index.test.ts

      - name: Install supabase CLI
        run: |
          mkdir -p supabase-cli
          curl -L "https://github.com/supabase/cli/releases/latest/download/supabase_linux_amd64.tar.gz" -o supabase.tar.gz
          tar -xzf supabase.tar.gz -C supabase-cli
          sudo mv supabase-cli/supabase /usr/local/bin/supabase
          supabase --version

      - name: Supabase login
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase login --access-token "$SUPABASE_ACCESS_TOKEN"

      - name: Deploy adaptive-quiz function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          supabase functions deploy adaptive-quiz --project-ref "$SUPABASE_PROJECT_REF"

      - name: Wait for function to be available
        run: sleep 5

      - name: Invoke function for quick smoke test
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          FUNC_URL="${SUPABASE_URL}/functions/v1/adaptive-quiz"
          echo "POST $FUNC_URL"
          curl -s -X POST "$FUNC_URL" -H "Content-Type: application/json" -d '{"level":"A1.1","topic":"Artikel"}' | jq .
